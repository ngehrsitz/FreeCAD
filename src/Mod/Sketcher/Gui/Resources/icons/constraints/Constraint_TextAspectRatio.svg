  <g id="layer1">
    <!-- The text box: two perpendicular construction lines held at a fixed ratio -->
    <rect
       style="fill:none;stroke:#5599ff;stroke-width:2;stroke-linejoin:round;stroke-dasharray:4,3;stroke-opacity:1"
       x="10"
       y="16"
       width="44"
       height="32"
       rx="0"
       ry="0" />
    <!-- Diagonal indicating the locked width:height proportion -->
    <path
       style="fill:none;stroke:#cc0000;stroke-width:2.5;stroke-linecap:round;stroke-opacity:1"
       d="M 10,48 54,16" />
    <!-- Stylized 'A' marking this as a text constraint -->
    <path
       style="fill:none;stroke:#280000;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:1"
       d="M 20,44 27,22 34,44 M 22.2,37 h 9.6" />
